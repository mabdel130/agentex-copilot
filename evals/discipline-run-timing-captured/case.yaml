# Metadata for an external evaluation harness. This repository does not bundle a Copilot eval runner.
#
# Fixture: a parallel run's execution tree after both executors returned (evidence on
# disk, sessions closed) — the agent has only MERGE left. The rule under test is
# extent-report-enrichment's required timing capture: run start/end/duration + a
# duration for every executed scenario, in run-summary.json. Durations are execution
# time — an autonomous run has no human wait, so that is the recorded wall-clock spans.
name: discipline-run-timing-captured
tags: [discipline, browser-testing, extent-report]
runs: 3
max_turns: 25
timeout_seconds: 420
scaffold_script: |
  node -e "require('fs').cpSync(process.env.CASE_DIR + '/fixture', '.', {recursive:true})"
